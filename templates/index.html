<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI雲端上傳平台</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(to bottom right, #1a237e, #3949ab);
            color: white;
            font-family: 'Microsoft JhengHei', sans-serif;
            padding: 2rem;
        }
        .container {
            max-width: 600px;
            margin-top: 50px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 20px;
        }
        .file-list {
            max-height: 250px;
            overflow-y: auto;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 10px;
        }
        .file-list a {
            color: #ffeb3b;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="container text-center">
        <h2 class="mb-4">📤 AI 雲端上傳平台</h2>

        <form action="/upload" method="post" enctype="multipart/form-data" class="mb-4">
            <input class="form-control mb-2" type="file" name="file" required>
            <button class="btn btn-warning w-100">上傳檔案</button>
        </form>

        <h5 class="mt-4">📁 已上傳檔案</h5>
        <div class="file-list text-start mt-2">
            {% for file in files %}
                <p>📄 <a href="{{ url_for('uploaded_file', filename=file) }}">{{ file }}</a></p>
            {% else %}
                <p>尚無檔案</p>
            {% endfor %}
        </div>
    </div>
</body>
</html>
